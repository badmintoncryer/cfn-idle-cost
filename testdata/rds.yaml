# RDS and Aurora charges that depend on more than the instance class: RDS
# Extended Support for an EngineVersion past its end of standard support (on
# the prices' date, 2026-11-16), Database Insights in Advanced mode and
# additional storage volumes. Priced with rdsPrices in rules_rds_test.go.
Resources:
  # MySQL 8.0: year 1-2 rate since 2026-08-01, on the standby too (2 x 2 vCPUs).
  MySQL80: { Type: AWS::RDS::DBInstance, Properties: { Engine: mysql, EngineVersion: "8.0.40", DBInstanceClass: db.r6g.large, MultiAZ: true, AllocatedStorage: 100 } }
  # MySQL 5.7: year 3 rate since 2026-03-01.
  MySQL57: { Type: AWS::RDS::DBInstance, Properties: { Engine: mysql, EngineVersion: "5.7.44", DBInstanceClass: db.t3.medium, AllocatedStorage: 20 } }
  # A read replica runs its source's version.
  MySQL57Replica: { Type: AWS::RDS::DBInstance, Properties: { SourceDBInstanceIdentifier: !Ref MySQL57, DBInstanceClass: db.t3.medium } }
  # With Extended Support disabled, RDS doesn't create a version past standard support.
  Pg13Disabled:
    Type: AWS::RDS::DBInstance
    Properties: { Engine: postgres, EngineVersion: "13.15", EngineLifecycleSupport: open-source-rds-extended-support-disabled, DBInstanceClass: db.r6g.large, AllocatedStorage: 20 }
  # PostgreSQL 16 is in standard support; Database Insights Advanced bills its 4 vCPUs.
  Pg16: { Type: AWS::RDS::DBInstance, Properties: { Engine: postgres, EngineVersion: "16.4", DatabaseInsightsMode: advanced, DBInstanceClass: db.m7g.xlarge, AllocatedStorage: 20 } }
  # No EngineVersion: the latest, in standard support.
  PgLatest: { Type: AWS::RDS::DBInstance, Properties: { Engine: postgres, DBInstanceClass: db.r6g.large, AllocatedStorage: 20 } }
  # Aurora PostgreSQL 13: Extended Support and Database Insights per vCPU, and per ACU on Serverless v2.
  AuroraPg13:
    Type: AWS::RDS::DBCluster
    Properties: { Engine: aurora-postgresql, EngineVersion: "13.15", DatabaseInsightsMode: advanced, ServerlessV2ScalingConfiguration: { MinCapacity: 2, MaxCapacity: 8 } }
  AuroraPg13Writer: { Type: AWS::RDS::DBInstance, Properties: { DBClusterIdentifier: !Ref AuroraPg13, DBInstanceClass: db.r6g.large } }
  AuroraPg13Reader: { Type: AWS::RDS::DBInstance, Properties: { DBClusterIdentifier: !Ref AuroraPg13, DBInstanceClass: db.serverless } }
  # Aurora MySQL 2: year 1-2 rate until 2026-12-01.
  AuroraMySQL2: { Type: AWS::RDS::DBCluster, Properties: { Engine: aurora-mysql, EngineVersion: 5.7.mysql_aurora.2.11.2 } }
  AuroraMySQL2Writer: { Type: AWS::RDS::DBInstance, Properties: { DBClusterIdentifier: !Ref AuroraMySQL2, DBInstanceClass: db.r5.large } }
  # A Multi-AZ DB cluster pays for its 3 instances.
  MultiAZCluster:
    Type: AWS::RDS::DBCluster
    Properties: { Engine: postgres, EngineVersion: "13.12", DBClusterInstanceClass: db.m6gd.large, StorageType: io1, AllocatedStorage: 100, Iops: 1000 }
  # A green copy on a newer version pays no Extended Support.
  BlueGreen: { Type: AWS::RDS::Deployment, Properties: { BlueGreenDeploymentName: bg, Source: !GetAtt MySQL57.DBInstanceArn, TargetEngineVersion: "8.4.3" } }
  # Additional storage volumes are billed like the instance's own storage.
  Oracle:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: oracle-se2
      LicenseModel: license-included
      DBInstanceClass: db.m5.large
      AllocatedStorage: 100
      AdditionalStorageVolumes:
        - { VolumeName: rdsdbdata2, AllocatedStorage: "200", StorageType: io2, Iops: 3000 }
        - { VolumeName: rdsdbdata3, AllocatedStorage: "50" }
