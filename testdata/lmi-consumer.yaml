Resources:
  Strong:
    Type: AWS::Lambda::Function
    Properties:
      CapacityProviderConfig:
        LambdaManagedInstancesCapacityProviderConfig: { CapacityProviderArn: !ImportValue "lmi-provider:ProviderArn" }
  WeakFn:
    Type: AWS::Lambda::Function
    Properties:
      CapacityProviderConfig:
        LambdaManagedInstancesCapacityProviderConfig:
          CapacityProviderArn: !GetStackOutput { StackName: lmi-provider, OutputName: WeakArn }
      FunctionScalingConfig: { MinExecutionEnvironments: 1, MaxExecutionEnvironments: 1 }
  # Its provider belongs to another app, so its instances are in no input.
  Foreign:
    Type: AWS::Lambda::Function
    Properties:
      CapacityProviderConfig:
        LambdaManagedInstancesCapacityProviderConfig: { CapacityProviderArn: "arn:aws:lambda:us-east-1:111111111111:capacity-provider:other-app" }
  Plain: { Type: AWS::Lambda::Function, Properties: { Runtime: nodejs22.x } }
  Queue:
    Type: AWS::Lambda::EventSourceMapping
    Properties: { FunctionName: !Ref WeakFn, EventSourceArn: arn }
  Pollers:
    Type: AWS::Lambda::EventSourceMapping
    Properties: { FunctionName: !Ref WeakFn, EventSourceArn: arn, ProvisionedPollerConfig: { MinimumPollers: 2 } }
