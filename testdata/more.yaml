# Resource types added in 0.0.3; priced with testPrices["eu-west-1"].
# EdgeBox is in a Local Zone, whose prices are not supported.
Conditions:
  Never: !Equals [!Ref "AWS::Region", nowhere-1]
Resources:
  Cluster:
    Type: AWS::EKS::Cluster
    Properties: { RoleArn: arn, ResourcesVpcConfig: { SubnetIds: [a, b] } }
  Nodes:
    Type: AWS::EKS::Nodegroup
    Properties: { ClusterName: !Ref Cluster, NodeRole: arn, Subnets: [a], InstanceTypes: [t3.medium], ScalingConfig: { MinSize: 1, DesiredSize: 2, MaxSize: 4 } }
  Firewall:
    Type: AWS::NetworkFirewall::Firewall
    Properties: { FirewallName: fw, FirewallPolicyArn: arn, VpcId: v, SubnetMappings: [{ SubnetId: a }, { SubnetId: b }] }
  Acl:
    Type: AWS::WAFv2::WebACL
    Properties: { Scope: REGIONAL, DefaultAction: { Allow: {} }, VisibilityConfig: {}, Rules: [{ Name: a }, { Name: b }, { Name: c }] }
  Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { MetricName: Errors, Namespace: AWS/Lambda, Period: 60, Threshold: 1, EvaluationPeriods: 1, ComparisonOperator: GreaterThanThreshold }
  MathAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Threshold: 1
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Metrics:
        - { Id: e, Expression: "a/b" }
        - { Id: a, MetricStat: { Metric: { MetricName: A, Namespace: N }, Period: 10, Stat: Sum }, ReturnData: false }
        - { Id: b, MetricStat: { Metric: { MetricName: B, Namespace: N }, Period: 10, Stat: Sum }, ReturnData: false }
  Fn:
    Type: AWS::Lambda::Function
    Properties: { MemorySize: 1024, Architectures: [arm64], Code: {}, Role: arn }
  Live:
    Type: AWS::Lambda::Alias
    Properties: { FunctionName: !Ref Fn, FunctionVersion: "1", Name: live, ProvisionedConcurrencyConfig: { ProvisionedConcurrentExecutions: 2 } }
  Attach:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties: { TransitGatewayId: tgw, VpcId: v, SubnetIds: [a, b] }
  Vpn:
    Type: AWS::EC2::VPNConnection
    Properties: { Type: ipsec.1, CustomerGatewayId: cgw, TransitGatewayId: tgw }
  Inbound:
    Type: AWS::Route53Resolver::ResolverEndpoint
    Properties: { Direction: INBOUND, SecurityGroupIds: [sg], IpAddresses: [{ SubnetId: a }, { SubnetId: b }] }
  Docs:
    Type: AWS::DocDB::DBCluster
    Properties: { StorageType: iopt1 }
  DocsInstance:
    Type: AWS::DocDB::DBInstance
    Properties: { DBClusterIdentifier: !Ref Docs, DBInstanceClass: db.t4g.medium }
  Kafka:
    Type: AWS::MSK::Cluster
    Properties:
      ClusterName: k
      KafkaVersion: "3.6.0"
      NumberOfBrokerNodes: 3
      BrokerNodeGroupInfo:
        InstanceType: kafka.m5.large
        ClientSubnets: [a, b, c]
        StorageInfo: { EBSStorageInfo: { VolumeSize: 100 } }
  Broker:
    Type: AWS::AmazonMQ::Broker
    Properties: { BrokerName: b, EngineType: RABBITMQ, EngineVersion: "3.13", DeploymentMode: CLUSTER_MULTI_AZ, HostInstanceType: mq.m5.large, PubliclyAccessible: false, Users: [] }
  Sftp:
    Type: AWS::Transfer::Server
  Proxy:
    Type: AWS::RDS::DBProxy
    Properties: { DBProxyName: p, EngineFamily: MYSQL, Auth: [], RoleArn: arn, VpcSubnetIds: [a] }
  ProxyTargets:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties: { DBProxyName: !Ref Proxy, TargetGroupName: default, DBClusterIdentifiers: [!Ref ProxyDb] }
  ProxyDb:
    Type: AWS::RDS::DBCluster
    Properties: { Engine: aurora-mysql, ServerlessV2ScalingConfiguration: { MinCapacity: 2, MaxCapacity: 8 } }
  ProxyDbWriter:
    Type: AWS::RDS::DBInstance
    Properties: { DBClusterIdentifier: !Ref ProxyDb, DBInstanceClass: db.r6g.large, Engine: aurora-mysql }
  ProxyDbReader:
    Type: AWS::RDS::DBInstance
    Properties: { DBClusterIdentifier: !Ref ProxyDb, DBInstanceClass: db.serverless, Engine: aurora-mysql }
  Logs:
    Type: AWS::OpenSearchServerless::Collection
    Properties: { Name: logs, Type: SEARCH }
  Logs2:
    Type: AWS::OpenSearchServerless::Collection
    Properties: { Name: logs2, Type: SEARCH }
  # Search and time series collections share OCUs when their KMS key is the same.
  Series:
    Type: AWS::OpenSearchServerless::Collection
    Properties: { Name: series, Type: TIMESERIES }
  Keyed:
    Type: AWS::OpenSearchServerless::Collection
    Properties: { Name: keyed, Type: SEARCH, EncryptionConfig: { KmsKeyArn: "arn:aws:kms:us-east-1:111122223333:key/a" } }
  Secure:
    Type: AWS::OpenSearchServerless::Collection
    Properties: { Name: secure-1, Type: SEARCH }
  SecureKey:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: secure
      Type: encryption
      Policy: '{"Rules":[{"ResourceType":"collection","Resource":["collection/secure*"]}],"AWSOwnedKey":false,"KmsARN":"arn:aws:kms:us-east-1:111122223333:key/b"}'
  # RDS Proxy bills at least 2 vCPUs per instance.
  SmallProxy:
    Type: AWS::RDS::DBProxy
    Properties: { DBProxyName: sp, EngineFamily: MYSQL, Auth: [], RoleArn: arn, VpcSubnetIds: [a] }
  SmallProxyTargets:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties: { DBProxyName: !Ref SmallProxy, TargetGroupName: default, DBInstanceIdentifiers: [!Ref SmallDb] }
  SmallDb:
    Type: AWS::RDS::DBInstance
    Properties: { Engine: mysql, DBInstanceClass: db.t2.small, AllocatedStorage: 20 }
  Vectors:
    Type: AWS::OpenSearchServerless::Collection
    Properties: { Name: vectors, Type: VECTORSEARCH, StandbyReplicas: DISABLED }
  Memory:
    Type: AWS::MemoryDB::Cluster
    Properties: { ClusterName: m, NodeType: db.t4g.small, ACLName: open-access, NumShards: 2 }
  Model:
    Type: AWS::SageMaker::Endpoint
    Properties: { EndpointConfigName: !GetAtt ModelConfig.EndpointConfigName }
  ModelConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - { VariantName: main, ModelName: m, InstanceType: ml.m5.large, InitialInstanceCount: 2 }
        - { VariantName: cheap, ModelName: m, ServerlessConfig: { MaxConcurrency: 5, MemorySizeInMB: 2048 } }
  EdgeBox:
    Type: AWS::EC2::Instance
    Properties: { InstanceType: t3.medium, AvailabilityZone: eu-west-1-lhr-1a }
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties: { PipelineType: V1, RoleArn: arn, Stages: [] }
  PipelineV2:
    Type: AWS::CodePipeline::Pipeline
    Properties: { PipelineType: V2, RoleArn: arn, Stages: [] }
  OffBoard:
    Type: AWS::CloudWatch::Dashboard
    Condition: Never
    Properties: { DashboardBody: "{}" }
  Board:
    Type: AWS::CloudWatch::Dashboard
    Properties: { DashboardBody: "{}" }
  RegionBox:
    Type: AWS::EC2::Instance
    Properties: { InstanceType: t3.medium, AvailabilityZone: !Select [0, !GetAZs ""] }
