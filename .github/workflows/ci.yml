name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      # The cdk synth plugin in the npm package, against the binary just built.
      - run: go build -o /tmp/cfn-idle-cost . && CFN_IDLE_COST_BINARY=/tmp/cfn-idle-cost node --test npm/cfn-idle-cost/test/plugin.test.js
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with: { path: testdata/template.yaml, args: --region us-east-1, comment: "false" }
